  let currentAuthMode = 'signin';
  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const tabSignIn = document.getElementById('tab-signin');

    const fieldName = document.getElementById('field-name');
    const linkForgot = document.getElementById('link-forgot');
    const btnText = document.getElementById('btn-text');
    if (mode === 'signup') {
      tabSignUp.className = 'w-1/2 py-1.5 px-space-sm text-center rounded font-label-md text-label-md uppercase tracking-wider transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';

      if (btnText) btnText.textContent = 'Create Free Academic Account';
    } else {
      tabSignIn.className = 'w-1/2 py-1.5 px-space-sm text-center rounded font-label-md text-label-md uppercase tracking-wider transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';

      if (linkForgot) linkForgot.classList.remove('opacity-0', 'pointer-events-none');
      if (btnText) btnText.textContent = 'Sign In to GapFinder';
    }
  }
  function togglePasswordVisibility() {
    const pwInput = document.getElementById('input-password');
    const pwIcon = document.getElementById('pw-icon');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      pwIcon.textContent = 'visibility_off';
    } else {
      pwInput.type = 'password';
      pwIcon.textContent = 'visibility';
    }
  }
